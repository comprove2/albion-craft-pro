<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALBION CRAFT PRO</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 94%;
    max-width: 1200px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    color: #f5b400;
    font-size: 40px;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
}

.painel {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #ccc;
}

input,
select,
button {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0d0d0d;
    color: white;
    font-size: 16px;
}

button {
    margin-top: 20px;
    background: #d99b00;
    color: #111;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #f5b400;
}

.grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 15px;
}

.item-box {
    display: none;
    align-items: center;
    gap: 20px;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 15px;
    margin-top: 20px;
}

.item-box img {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

.item-nome {
    font-size: 22px;
    font-weight: bold;
    color: #f5b400;
}

.item-id {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.info {
    margin-top: 15px;
    color: #aaa;
}

.erro {
    color: #ff5555;
    margin-top: 15px;
}

.sucesso {
    color: #5cff7a;
    margin-top: 15px;
}

.resultado {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    color: #f5b400;
    text-align: left;
    padding: 13px;
    border-bottom: 1px solid #444;
}

td {
    padding: 13px;
    border-bottom: 1px solid #292929;
}

.preco {
    color: #5cff7a;
    font-weight: bold;
}

.sem-dados {
    color: #777;
}

@media(max-width: 700px) {

    .grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 28px;
    }

}

</style>
</head>

<script>


/* =====================================================
   ITEM SELECIONADO
===================================================== */

const itemSelect =
document.getElementById("itemSelect");


itemSelect.addEventListener(
"change",
mostrarItem
);


function mostrarItem() {

const id = itemSelect.value;

const box =
document.getElementById("itemBox");

const imagem =
document.getElementById("imagemItem");

const nome =
document.getElementById("nomeItem");

const codigo =
document.getElementById("idItem");


if (!id) {

box.style.display = "none";

return;

}


let nomeItem =
itemSelect.options[itemSelect.selectedIndex].text;


nome.textContent = nomeItem;

codigo.textContent = id;


/*
Imagem oficial do Render Albion
*/

imagem.src =
"https://render.albiononline.com/v1/item/"
+ id
+ ".png";


imagem.onerror = function() {

this.src =
"https://render.albiononline.com/v1/item/"
+ id;

};


box.style.display = "flex";

}


/* =====================================================
   BUSCAR PREÇOS
===================================================== */

async function buscarPrecos() {


const id =
itemSelect.value;


const qualidade =
document.getElementById("qualidade").value;


const quantidade =
document.getElementById("quantidade").value;


const tabela =
document.getElementById("tabela");


const mensagem =
document.getElementById("mensagem");


if (!id) {

mensagem.innerHTML =
'<div class="erro">Selecione um item primeiro.</div>';

return;

}


mensagem.innerHTML =
'<div class="info">Consultando preços reais...</div>';


tabela.innerHTML = "";


const cidades = [

"Bridgewatch",
"Caerleon",
"Fort Sterling",
"Lymhurst",
"Martlock",
"Thetford",
"Brecilien"

];


try {


const url =

"https://west.albion-online-data.com/api/v2/stats/prices/"

+ encodeURIComponent(id)

+ ".json?locations="

+ encodeURIComponent(
cidades.join(",")
)

+ "&qualities="

+ qualidade;


console.log(url);


const resposta =
await fetch(url);


if (!resposta.ok) {

throw new Error(
"HTTP " + resposta.status
);

}


const dados =
await resposta.json();


console.log(
"Resposta da API:",
dados
);


const mapa = {};


dados.forEach(item => {

mapa[item.city] = item;

});


let menorPreco = null;

let melhorCidade = "";


cidades.forEach(cidade => {


const item =
mapa[cidade];


const linha =
document.createElement("tr");


if (!item) {


linha.innerHTML = `

<td>${cidade}</td>

<td class="sem-dados">
SEM DADOS
</td>

<td class="sem-dados">
SEM DADOS
</td>

<td>-</td>

`;


} else {


const minimo =
Number(
item.sell_price_min || 0
);


const maximo =
Number(
item.sell_price_max || 0
);


if (
minimo > 0 &&
(
menorPreco === null ||
minimo < menorPreco
)
) {

menorPreco = minimo;

melhorCidade =
cidade;

}


linha.innerHTML = `

<td>${cidade}</td>

<td class="preco">

${formatar(minimo)}

</td>

<td class="preco">

${formatar(maximo)}

</td>

<td>

${formatarData(
item.sell_price_min_date
)}

</td>

`;

}


tabela.appendChild(linha);


});


if (menorPreco !== null) {


mensagem.innerHTML = `

<div class="sucesso">

Menor preço encontrado:
<strong>
${formatar(menorPreco)} prata
</strong>

em

<strong>
${melhorCidade}
</strong>

<br>

Quantidade:
<strong>
${quantidade}
</strong>

</div>

`;


} else {


mensagem.innerHTML = `

<div class="erro">

O item foi encontrado, mas a API não possui preço registrado para essas cidades/qualidade.

</div>

`;


}


} catch (erro) {


console.error(erro);


mensagem.innerHTML = `

<div class="erro">

Erro ao consultar os preços.

<br><br>

Verifique o Console do navegador para mais detalhes.

</div>

`;


}

}


/* =====================================================
   FORMATAÇÃO
===================================================== */

function formatar(numero) {

if (!numero || numero <= 0) {

return "-";

}

return Number(numero)
.toLocaleString("pt-BR");

}


function formatarData(data) {

if (!data) {

return "-";

}


try {

return new Date(data)
.toLocaleString("pt-BR");

} catch {

return "-";

}

}

</script>
