```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALBION CRAFT PRO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #090909;
    color: white;
}

.container {
    width: 95%;
    max-width: 1200px;
    margin: 30px auto;
}

h1 {
    text-align: center;
    color: #f5b400;
    font-size: 40px;
}

.subtitulo {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
}

.painel {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
}

select,
input,
button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0c0c0c;
    color: white;
    font-size: 16px;
}

button {
    margin-top: 20px;
    background: #d99b00;
    color: #111;
    font-weight: bold;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #f5b400;
}

.item {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
    padding: 15px;
    background: #0d0d0d;
    border-radius: 10px;
}

.item img {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

.item h2 {
    margin: 0;
    color: #f5b400;
}

.codigo {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.mensagem {
    margin-top: 15px;
}

.sucesso {
    color: #5cff7a;
}

.erro {
    color: #ff5555;
}

.info {
    color: #aaa;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #333;
    text-align: left;
}

th {
    color: #f5b400;
}

.preco {
    color: #5cff7a;
    font-weight: bold;
}

.sem {
    color: #777;
}

@media(max-width:700px) {
    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>ALBION CRAFT PRO</h1>

<div class="subtitulo">
Mercado de Albion Online • Américas
</div>

<div class="painel">

<label>Escolha o item</label>

<select id="item">

<option value="T4_2H_CLAYMORE">
Claymore T4
</option>

<option value="T5_2H_CLAYMORE">
Claymore T5
</option>

<option value="T6_2H_CLAYMORE">
Claymore T6
</option>

<option value="T7_2H_CLAYMORE">
Claymore T7
</option>

<option value="T8_2H_CLAYMORE">
Claymore T8
</option>

<option value="T4_BAG">
Bolsa T4
</option>

<option value="T5_BAG">
Bolsa T5
</option>

<option value="T6_BAG">
Bolsa T6
</option>

<option value="T7_BAG">
Bolsa T7
</option>

<option value="T8_BAG">
Bolsa T8
</option>

</select>


<label style="display:block;margin-top:15px;">
Qualidade
</label>

<select id="qualidade">

<option value="1">1 - Normal</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>

</select>


<div class="item">

<img id="imagem">

<div>

<h2 id="nome">
Claymore T4
</h2>

<div class="codigo" id="codigo">
T4_2H_CLAYMORE
</div>

</div>

</div>


<button onclick="buscarPrecos()">
BUSCAR PREÇOS REAIS
</button>

<div id="mensagem" class="mensagem"></div>

</div>


<div class="painel">

<h2>Preços nas cidades</h2>

<table>

<thead>

<tr>
<th>Cidade</th>
<th>Venda mínima</th>
<th>Venda máxima</th>
<th>Atualização</th>
</tr>

</thead>

<tbody id="resultado">

<tr>
<td colspan="4" class="sem">
Clique em BUSCAR PREÇOS REAIS.
</td>
</tr>

</tbody>

</table>

</div>

</div>


<script>

const itemSelect =
document.getElementById("item");

const imagem =
document.getElementById("imagem");

const nome =
document.getElementById("nome");

const codigo =
document.getElementById("codigo");


function atualizarItem() {

const id =
itemSelect.value;

const texto =
itemSelect.options[
itemSelect.selectedIndex
].text;

nome.textContent = texto;

codigo.textContent = id;

imagem.src =
"https://render.albiononline.com/v1/item/"
+ id
+ ".png";

}


itemSelect.addEventListener(
"change",
atualizarItem
);

atualizarItem();


async function buscarPrecos() {

const id =
itemSelect.value;

const qualidade =
document.getElementById("qualidade").value;

const resultado =
document.getElementById("resultado");

const mensagem =
document.getElementById("mensagem");


mensagem.innerHTML =
'<div class="info">Consultando mercado...</div>';

resultado.innerHTML = "";


const cidades = [
"Bridgewatch",
"Caerleon",
"Fort Sterling",
"Lymhurst",
"Martlock",
"Thetford",
"Brecilien"
];


const url =
"https://west.albion-online-data.com/api/v2/stats/prices/"
+ id
+ ".json?locations="
+ cidades.join(",")
+ "&qualities="
+ qualidade;


console.log("Consultando:", url);


try {

const resposta =
await fetch(url);


if (!resposta.ok) {

throw new Error(
"HTTP " + resposta.status
);

}


const dados =
await resposta.json();


console.log(
"Resposta recebida:",
dados
);


if (!Array.isArray(dados)) {

throw new Error(
"Resposta inesperada da API"
);

}


let encontrou = false;


cidades.forEach(cidade => {

const registro =
dados.find(
item => item.city === cidade
);


const linha =
document.createElement("tr");


if (!registro) {

linha.innerHTML = `

<td>${cidade}</td>

<td class="sem">
SEM DADOS
</td>

<td class="sem">
SEM DADOS
</td>

<td>-</td>

`;

} else {

encontrou = true;


const minimo =
registro.sell_price_min || 0;

const maximo =
registro.sell_price_max || 0;

const data =
registro.sell_price_min_date || "";


linha.innerHTML = `

<td>${cidade}</td>

<td class="preco">
${formatar(minimo)}
</td>

<td class="preco">
${formatar(maximo)}
</td>

<td>
${formatarData(data)}
</td>

`;

}


resultado.appendChild(linha);

});


if (encontrou) {

mensagem.innerHTML =
'<div class="sucesso">Preços encontrados com sucesso! ✅</div>';

} else {

mensagem.innerHTML =
'<div class="erro">O item existe, mas não há dados de mercado para essa qualidade nas cidades consultadas.</div>';

}


} catch (erro) {

console.error(
"ERRO:",
erro
);

mensagem.innerHTML = `

<div class="erro">

Erro ao consultar a API de preços.

<br><br>

Erro:
${erro.message}

</div>

`;

}

}


function formatar(numero) {

if (!numero || numero <= 0) {

return "-";

}

return Number(numero)
.toLocaleString("pt-BR");

}


function formatarData(data) {

if (!data) {

return "-";

}

return new Date(data)
.toLocaleString("pt-BR");

}

</script>

</body>
</html>
